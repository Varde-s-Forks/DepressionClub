name: "Setup HIP (Linux)"
description: "Downloads and configures the AMD ROCm TheRock Core SDK and optional MIGraphX for Linux (Manylinux / RHEL)"
inputs:
  hip-version:
    description: "ROCm TheRock SDK version (e.g., 10.0.0)"
    required: true
  migraphx-version:
    description: "MIGraphX version (e.g., 2.17.0)"
    required: false
    default: "2.17.0"
  install-migraphx:
    description: "Whether to install MIGraphX"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download and Extract ROCm TheRock SDK
      shell: bash
      run: |
        archive="therock-dist-linux-multiarch-${{ inputs.hip-version }}.tar.gz"
        mkdir -p /opt/rocm
        curl -fsSL --retry 3 "https://stable.repo.amd.com/rocm/core/tarball/$archive" | tar -xzf - -C /opt/rocm --strip-components=1

    - name: Download and Extract MIGraphX SDK
      if: inputs.install-migraphx == 'true'
      shell: bash
      run: |
        migraphx_archive="migraphx-${{ inputs.migraphx-version }}%2Brocm${{ inputs.hip-version }}.tar.gz"
        mkdir -p /opt/migraphx
        curl -fsSL --retry 3 "https://stable.repo.amd.com/rocm/migraphx/tarball/$migraphx_archive" | tar -xzf - -C /opt/migraphx --strip-components=1

    - name: Configure HIP Path
      shell: bash
      run: |
        # GCC Toolset 14 is required for C++20 on Manylinux 2.28.
        source /opt/rh/gcc-toolset-14/enable
        GCC_ROOT=/opt/rh/gcc-toolset-14/root/usr
        GCC_VER=$(gcc -dumpversion)
        GCC_TRIPLET=$(gcc -dumpmachine)

        ROCM_PATH=/opt/rocm
        LLVM_ROOT="$ROCM_PATH/lib/llvm"
        LLVM_BIN_DIR="$LLVM_ROOT/bin"
        AMDCLANG_PATH="$LLVM_BIN_DIR/amdclang"
        MIGRAPHX_DIR="/opt/migraphx"

        echo "$ROCM_PATH/bin:$LLVM_BIN_DIR" >> "$GITHUB_PATH"
        if [ "${{ inputs.install-migraphx }}" = "true" ]; then
          echo "$MIGRAPHX_DIR/bin" >> "$GITHUB_PATH"
        fi

        {
          echo "ROCM_PATH=$ROCM_PATH"
          echo "HIP_PATH=$ROCM_PATH"
          echo "HIP_DIR=$ROCM_PATH/lib/cmake/hip"
          echo "HIP_DEVICE_LIB_PATH=$LLVM_ROOT/amdgcn/bitcode"
          echo "HIP_PLATFORM=amd"
          echo "LLVM_PATH=$LLVM_ROOT"
          echo "CC=$AMDCLANG_PATH"
          echo "CXX=$LLVM_BIN_DIR/amdclang++"
          echo "CFLAGS=--gcc-toolchain=$GCC_ROOT"
          echo "CXXFLAGS=--gcc-toolchain=$GCC_ROOT"
          echo "LDFLAGS=--gcc-toolchain=$GCC_ROOT"
          echo "CPLUS_INCLUDE_PATH=$GCC_ROOT/include/c++/$GCC_VER:$GCC_ROOT/include/c++/$GCC_VER/$GCC_TRIPLET${CPLUS_INCLUDE_PATH:+:${CPLUS_INCLUDE_PATH}}"
          echo "LIBRARY_PATH=$GCC_ROOT/lib/gcc/$GCC_TRIPLET/$GCC_VER:/usr/lib64${LIBRARY_PATH:+:${LIBRARY_PATH}}"
          if [ "${{ inputs.install-migraphx }}" = "true" ]; then
            echo "MIGRAPHX_DIR=$MIGRAPHX_DIR/lib/cmake/migraphx"
            echo "MIGRAPHX_DIR=$MIGRAPHX_DIR"
            echo "ROCM_EXTRAS_PATH=$MIGRAPHX_DIR"
            echo "CMAKE_PREFIX_PATH=$ROCM_PATH:$MIGRAPHX_DIR"
            echo "LD_LIBRARY_PATH=$MIGRAPHX_DIR/lib:$ROCM_PATH/lib:$ROCM_PATH/lib64:$GCC_ROOT/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          else
            echo "CMAKE_PREFIX_PATH=$ROCM_PATH"
            echo "LD_LIBRARY_PATH=$ROCM_PATH/lib:$ROCM_PATH/lib64:$GCC_ROOT/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          fi
        } >> "$GITHUB_ENV"
